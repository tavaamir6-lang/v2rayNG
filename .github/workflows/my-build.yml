name: My Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Build libhevtun
        run: |
          if [ -f compile-hevtun.sh ]; then
            bash compile-hevtun.sh
          fi

      - name: Copy libhevtun
        run: |
          if [ -d libs ]; then
            mkdir -p V2rayNG/app/libs
            cp -r libs/* V2rayNG/app/libs/ 2>/dev/null || true
          fi

      - name: Fetch AndroidLibXrayLite tag
        run: |
          if [ -d AndroidLibXrayLite ]; then
            cd AndroidLibXrayLite
            TAG=$(git describe --tags --abbrev=0)
            echo "LIB_TAG=$TAG" >> $GITHUB_ENV
          else
            echo "LIB_TAG=v26.9.9" >> $GITHUB_ENV
          fi

      - name: Download libv2ray
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L -o V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/${{ env.LIB_TAG }}/libv2ray.aar"

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias myalias \
            -storepass pass1234 \
            -keypass pass1234 \
            -dname "CN=App, OU=Dev, O=Org, L=City, S=State, C=IR"

      - name: Build APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=pass1234 \
            -Pandroid.injected.signing.key.alias=myalias \
            -Pandroid.injected.signing.key.password=pass1234

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: V2rayNG/app/build/outputs/apk/release/*.apk

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore
          path: release.jks
