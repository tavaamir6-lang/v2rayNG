name: Build Custom

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Download libv2ray
        run: |
          mkdir -p V2rayNG/app/libs
          curl -L -o V2rayNG/app/libs/libv2ray.aar \
            "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.9.9/libv2ray.aar"

      - name: Fix strings.xml
        run: |
          # دانلود نسخه‌ی تمیز از مخزن اصلی
          curl -L -o /tmp/clean_strings.xml \
            "https://raw.githubusercontent.com/2dust/v2rayNG/master/V2rayNG/app/src/main/res/values/strings.xml"
          
          # تغییر اسم اپ
          sed -i 's|<string name="app_name" translatable="false">v2rayNG</string>|<string name="app_name" translatable="false">Light speed</string>|' /tmp/clean_strings.xml
          
          # کپی روی فایل پروژه
          cp /tmp/clean_strings.xml V2rayNG/app/src/main/res/values/strings.xml
          
          # نمایش خط app_name برای تأیید
          grep 'name="app_name"' V2rayNG/app/src/main/res/values/strings.xml

      - name: Apply icon
        run: |
          sudo apt-get install -y imagemagick
          
          if [ -f icon.jpg ]; then
            declare -A sizes=( ["mdpi"]=48 ["hdpi"]=72 ["xhdpi"]=96 ["xxhdpi"]=144 ["xxxhdpi"]=192 )
            
            for folder in "${!sizes[@]}"; do
              size=${sizes[$folder]}
              target="V2rayNG/app/src/main/res/mipmap-$folder"
              mkdir -p "$target"
              
              convert icon.jpg -resize ${size}x${size} "$target/ic_launcher.png"
              convert icon.jpg -resize ${size}x${size} "$target/ic_launcher_round.png"
              convert icon.jpg -resize ${size}x${size} "$target/ic_launcher_foreground.png"
            done
            
            echo "=== Icon files created ==="
            find V2rayNG/app/src/main/res/mipmap-* -name "ic_launcher*.png"
          fi

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias myalias \
            -storepass pass1234 \
            -keypass pass1234 \
            -dname "CN=App, OU=Dev, O=Org, L=City, S=State, C=IR"

      - name: Build APK
        run: |
          cd V2rayNG
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/release.jks \
            -Pandroid.injected.signing.store.password=pass1234 \
            -Pandroid.injected.signing.key.alias=myalias \
            -Pandroid.injected.signing.key.password=pass1234

      - name: Find and collect APKs
        run: |
          find . -name "*.apk" -type f
          mkdir -p /tmp/apk-output
          find . -name "*.apk" -type f -exec cp {} /tmp/apk-output/ \;
          ls -la /tmp/apk-output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-apk
          path: /tmp/apk-output/*.apk
          if-no-files-found: error

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: my-keystore
          path: release.jks
